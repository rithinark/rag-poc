[project]
name = "rag-poc"
version = "0.2.0"
description = "Architectural Blueprint for Secure Retrieval-Augmented Generation: Endpoint Engineering, Model Context Protocol Integration, and Multi-Tiered Guardrail Systems"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.6.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",
    "tiktoken>=0.7.0",
    "langchain-text-splitters>=0.2.0",
    "onnxruntime>=1.17.0",
    "onnx>=1.16.0",
    "onnxscript>=0.7.0",
    "tokenizers>=0.19.0",
    "docling>=2.0.0",
    "mcp>=1.3.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=2.0.0",
    "chainlit>=1.3.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_poc"]
